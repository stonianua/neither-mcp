name: gemini-extension

on:
  push:
    branches: [main]
    paths:
      - "gemini-extension.json"
      - "GEMINI.md"
      - "scripts/pack-gemini-extension.sh"
      - "scripts/test-gemini-extension-pack.mjs"
      - "scripts/lib/gemini-cli-0.59-release-asset.mjs"
      - ".github/workflows/gemini-extension.yml"
  pull_request:
    paths:
      - "gemini-extension.json"
      - "GEMINI.md"
      - "scripts/pack-gemini-extension.sh"
      - "scripts/test-gemini-extension-pack.mjs"
      - "scripts/lib/gemini-cli-0.59-release-asset.mjs"
      - ".github/workflows/gemini-extension.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pack and test Gemini CLI github-release archives
        run: node scripts/test-gemini-extension-pack.mjs
      - name: Upload Gemini CLI archives
        uses: actions/upload-artifact@v4
        with:
          name: neither-gemini-extension
          path: |
            darwin.neither-mcp.tar.gz
            linux.neither-mcp.tar.gz
            win32.neither-mcp.zip
          if-no-files-found: error

  attach-to-release:
    needs: pack-and-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neither-gemini-extension
          path: .
      - name: Attach Gemini archives to the GitHub Release (keep .mcpb)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l darwin.neither-mcp.tar.gz linux.neither-mcp.tar.gz win32.neither-mcp.zip
          TAG="${{ github.event.release.tag_name }}"
          if [[ -z "${TAG}" ]]; then
            TAG="$(gh release view --json tagName --jq .tagName)"
          fi
          # Do not delete or replace neither-mcp-*.mcpb — Claude Desktop path.
          gh release upload "${TAG}" \
            darwin.neither-mcp.tar.gz \
            linux.neither-mcp.tar.gz \
            win32.neither-mcp.zip \
            --clobber
          echo "Attached Gemini CLI archives to ${TAG} (Claude .mcpb left in place)."
