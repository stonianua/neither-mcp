name: mcpb

on:
  push:
    paths:
      - "mcpb/**"
      - "packages/mcp-server/**"
      - "scripts/pack-mcpb.sh"
      - ".github/workflows/mcpb.yml"
      - "DESKTOP-EXTENSION.md"
  pull_request:
    paths:
      - "mcpb/**"
      - "packages/mcp-server/**"
      - "scripts/pack-mcpb.sh"
      - ".github/workflows/mcpb.yml"
      - "DESKTOP-EXTENSION.md"

jobs:
  validate-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install, build, and test MCP server
        working-directory: packages/mcp-server
        run: |
          npm install
          npm run build
          npm test
      - name: Validate MCPB manifest
        run: npx -y @anthropic-ai/mcpb validate mcpb/manifest.json
      - name: Pack MCPB
        run: bash scripts/pack-mcpb.sh
      - name: Upload MCPB artifact
        uses: actions/upload-artifact@v4
        with:
          name: neither-mcpb
          path: neither-mcp-*.mcpb
          if-no-files-found: error
